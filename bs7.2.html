<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Exercise 7.2</title>

    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="text-center mb-5">
        <i class="bi bi-people-fill"></i>
        GDG Chennai Community
    </h1>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="border rounded p-4 h-100 bg-white">

                <i class="bi bi-people fs-2 text-primary"></i>

                <h5 class="mt-3 text-uppercase">
                    gdg chennai annual meetup
                </h5>

                <p class="text-muted">
                    Monthly community gathering.
                </p>

            </div>
        </div>

        <div class="col-md-4">
            <div class="border rounded p-4 h-100 bg-white">

                <i class="bi bi-calendar-event fs-2 text-success"></i>

                <h5 class="mt-3 text-lowercase">
                    DEVFEST 2026 KEYNOTE SESSION
                </h5>

                <p class="text-muted">
                    Annual developer conference.
                </p>

            </div>
        </div>

        <div class="col-md-4">
            <div class="border rounded p-4 h-100 bg-white">

                <i class="bi bi-mortarboard fs-2 text-danger"></i>

                <h5 class="mt-3 text-capitalize">
                    women techmakers leadership summit
                </h5>

                <p class="text-muted">
                    Leadership and networking event.
                </p>

            </div>
        </div>

    </div>

</div>

</body>
</html>
