<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDG Coimbatore Registration Portal</title>

    ```
    <link rel="stylesheet"
          href="bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            min-height:100vh;

            background: linear-gradient(
                    to right,
                    #4285F4,
                    #EA4335,
                    #FBBC05,
                    #34A853
            );
        }

        .registration-box{
            background:white;
            border-radius:20px;
        }

        .event-item{
            background:#f8f9fa;
            padding:12px;
            border-radius:10px;
            margin-bottom:12px;
        }

    </style>
    ```

</head>

<body>

<div class="container py-5">

    ```
    <div class="text-center text-white mb-5">

        <h1 class="display-4 fw-bold">
            <i class="bi bi-people-fill"></i>
            GDG Coimbatore
        </h1>

        <p class="lead">
            Connect • Learn • Build
        </p>

        <p>
            Join workshops, study jams, hackathons and networking events.
        </p>

    </div>

    <div class="registration-box shadow-lg p-4">

        <div class="row">

            <!-- Left Panel -->

            <div class="col-lg-4 mb-4">

                <h3 class="mb-4">
                    Upcoming Events
                </h3>

                <div class="event-item">
                    <i class="bi bi-calendar-event text-primary"></i>
                    DevFest Coimbatore 2026
                </div>

                <div class="event-item">
                    <i class="bi bi-cloud text-info"></i>
                    Cloud Study Jam
                </div>

                <div class="event-item">
                    <i class="bi bi-robot text-success"></i>
                    AI Community Meetup
                </div>

                <div class="event-item">
                    <i class="bi bi-shield-lock text-danger"></i>
                    Cyber Security Forum
                </div>

                <div class="event-item">
                    <i class="bi bi-stars text-warning"></i>
                    Women Techmakers
                </div>

                <div class="event-item">
                    <i class="bi bi-code-slash text-secondary"></i>
                    Open Source Connect
                </div>

            </div>

            <!-- Registration Form -->

            <div class="col-lg-8">

                <h3 class="mb-4 text-primary">
                    Community Registration
                </h3>

                <form>

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter your full name">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               class="form-control"
                               placeholder="Enter your email address">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            College / Institution
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter your college name">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            GitHub Profile
                        </label>

                        <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-github"></i>
                        </span>

                            <input type="text"
                                   class="form-control"
                                   placeholder="github.com/username">

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Interested Domain
                        </label>

                        <select class="form-select">

                            <option>Artificial Intelligence</option>
                            <option>Cloud Computing</option>
                            <option>Cyber Security</option>
                            <option>Web Development</option>
                            <option>Open Source</option>

                        </select>

                    </div>

                    <div class="form-check mb-4">

                        <input class="form-check-input"
                               type="checkbox"
                               id="updates">

                        <label class="form-check-label"
                               for="updates">

                            Notify me about future GDG Coimbatore events

                        </label>

                    </div>

                    <button class="btn btn-primary btn-lg">
                        Register Now
                    </button>

                </form>

            </div>

        </div>

    </div>
    ```

</div>

<script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
