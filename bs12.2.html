<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>12.2 Pricing</title>

    <link rel="stylesheet"
          href="bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <style>

        .pricing-box{
            color:white;
            border-radius:15px;
            padding:30px;
        }

        .basic{
            background: linear-gradient(135deg,#4285F4,#34A853);
        }

        .pro{
            background: linear-gradient(135deg,#EA4335,#FBBC05);
            transform: scale(1.05);
        }

        .premium{
            background: linear-gradient(135deg,#673AB7,#4285F4);
        }

    </style>

</head>

<body>

<div class="container mt-5 text-center">

    <h3 class="mb-5">Pricing Plans</h3>

    <div class="row">


        <div class="col-md-4 p-3">

            <div class="pricing-box basic">

                <h4>Basic</h4>
                <p>Free Access</p>
                <h2>₹0</h2>

                <button class="btn btn-light mt-3">
                    Select
                </button>

            </div>

        </div>

        <div class="col-md-4 p-3">

            <div class="pricing-box pro">

                <h4>Pro</h4>
                <p>Best for Students</p>
                <h2>₹499</h2>

                <button class="btn btn-dark mt-3">
                    Select
                </button>

            </div>

        </div>
        <div class="col-md-4 p-3">

            <div class="pricing-box premium">

                <h4>Premium</h4>
                <p>Advanced Access</p>
                <h2>₹999</h2>

                <button class="btn btn-light mt-3">
                    Select
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
