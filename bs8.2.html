<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDG Coimbatore Login</title>

    ```
    <link rel="stylesheet"
          href="bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            min-height:100vh;

            background: linear-gradient(
                    to right,
                    #4285F4,
                    #EA4335,
                    #FBBC05,
                    #34A853
            );
        }

        .login-box{
            background:white;
            border-radius:20px;
        }

    </style>
    ```

</head>

<body>

<div class="container">

    ```
    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-6 col-lg-5">

            <div class="login-box shadow-lg p-5">

                <div class="text-center mb-4">

                    <i class="bi bi-person-circle display-3 text-primary"></i>

                    <h2 class="mt-3">
                        GDG Coimbatore
                    </h2>

                    <p class="text-muted">
                        Member Login Portal
                    </p>

                </div>

                <form>

                    <div class="form-floating mb-3">

                        <input type="email"
                               class="form-control"
                               id="email"
                               placeholder="Email Address">

                        <label for="email">
                            Email Address
                        </label>

                    </div>

                    <div class="form-floating mb-4">

                        <input type="password"
                               class="form-control"
                               id="password"
                               placeholder="Password">

                        <label for="password">
                            Password
                        </label>

                    </div>

                    <button class="btn btn-primary w-100">
                        Sign In
                    </button>

                </form>

            </div>

        </div>

    </div>
    ```

</div>

<script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
