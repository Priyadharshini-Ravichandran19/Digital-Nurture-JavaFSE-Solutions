<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>13.2 Gradient</title>

    <link rel="stylesheet"
          href="bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <style>

        body{
            min-height:100vh;
            color:white;

            background: linear-gradient(
                    135deg,
                    #0d6efd,
                    #6610f2,
                    #dc3545,
                    #fd7e14
            );
        }

        .box{
            background: rgba(0,0,0,0.3);
            padding:20px;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <h2 class="text-center mb-4">
        GDG Coimbatore Portal
    </h2>

    <div class="row">

        <div class="col-md-6 mb-3">

            <div class="box">
                <h4>About Community</h4>
                <p>
                    A student developer community focused on learning and collaboration.
                </p>
            </div>

        </div>

        <div class="col-md-6 mb-3">

            <div class="box">
                <h4>Upcoming Events</h4>
                <p>
                    Workshops, hackathons, and study jams for students.
                </p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
